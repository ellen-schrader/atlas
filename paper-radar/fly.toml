# Fly.io config for the Atlas API (docs/DEPLOYMENT_PLAN.md, phase 3).
# Deploy from this directory: fly deploy --remote-only
app = "paper-radar-api"
primary_region = "lhr"
[build]
  dockerfile = "api/Dockerfile"

[env]
  # The Claude connector (atlas_mcp/http.py): requests for this host go to the hosted
  # MCP server in this same process; every other host is the API. Not a secret.
  MCP_PUBLIC_URL = "https://mcp.labatlas.app"

[http_service]
  internal_port = 8080
  force_https = true
  # Machines suspend (RAM snapshot) after a few idle minutes and resume in
  # well under a second — NOT "stop": a full cold boot takes longer than the
  # ~5 s reply window Teams gives its Outgoing Webhook, so every first @Atlas
  # mention after an idle period made Teams post "please fix the bot source
  # code" into the channel (issue #93). The idle window is a proxy heuristic,
  # not a guarantee — a background embed killed mid-flight is recovered by
  # api/backfill_embeddings.py. Suspend needs a machine with no swap configured.
  #
  # The always-on machine tried for October (issue #104: the first mention after
  # idle can still time out) was reverted in Nov 2026 to save its cost.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

# 512 MB since topic maps were retired (Nov 2026): the in-process t-SNE + KMeans
# (scikit-learn/scipy) were the only heavy work. The API idles at ~100 MB RSS with
# one uvicorn worker. No swap (it would block suspend), so if it ever OOMs, go
# back to "1gb" before anything else.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
