<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The Atlas mark: a field of points inside a map hull (see components/Brand.tsx).
         Was the old lucide compass in the pre-redesign blue. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3.2 27.4 10v12L16 28.8 4.6 22V10z' fill='none' stroke='%230a6e6b' stroke-width='1.6' stroke-linejoin='round' opacity='.45'/><g fill='%230a6e6b'><circle cx='16' cy='9.4' r='2.6'/><circle cx='10.6' cy='15' r='1.7'/><circle cx='21.6' cy='14.2' r='1.9'/><circle cx='13.4' cy='20.6' r='1.5'/><circle cx='20' cy='21' r='1.3'/></g></svg>"
    />
    <!-- The UI font, preloaded so the first paint isn't in the fallback face. -->
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Atlas — a shared paper library for research groups</title>
    <meta
      name="description"
      content="A shared paper library for research groups. Keep your lab's papers in one place, find them by meaning, and let Claude answer from them."
    />
    <meta property="og:title" content="Atlas — a shared paper library that gives Claude your lab's judgment" />
    <meta
      property="og:description"
      content="Keep your group's papers in one place. Let Claude answer from them."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://labatlas.app/" />
    <!-- The landing page's hero at 1200×630, so a link pasted into Slack or
         Teams unfurls as a card. Absolute: crawlers don't resolve relative URLs. -->
    <meta property="og:image" content="https://labatlas.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
